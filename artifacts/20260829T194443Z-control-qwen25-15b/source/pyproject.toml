[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-replay"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "datasets==4.1.1",
  "huggingface-hub==0.36.0",
  "numpy==2.2.6",
  "safetensors==0.6.2",
  "scikit-learn==1.7.2",
  "scipy==1.15.3",
  "transformers==4.57.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
